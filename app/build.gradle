plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.danalistener.app'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.danalistener.app"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 4
        versionName "2.2"
    }

    buildTypes {
        release {
            // Release = non-debuggable, jauh lebih enteng di CPU dibanding debug (bantu HP low-end ga panas)
            minifyEnabled true
            shrinkResources true
            // Ditandatangani pakai debug key biar tetap bisa diinstall langsung tanpa keystore sendiri
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.9.0'
    // Retry kirim webhook & watchdog yang tahan proses di-kill / Doze
    implementation 'androidx.work:work-runtime:2.8.1'
}
